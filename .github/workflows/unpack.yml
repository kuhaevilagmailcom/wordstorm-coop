name: Unpack WORDSTORM source
on:
  push:
    paths:
      - bundle/READY
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore project files
        run: node scripts/unpack.mjs
      - name: Test syntax and game logic
        run: |
          npm install --no-audit --no-fund
          npm run check
          npm test
          npm run build
      - name: Commit all source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf bundle
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish complete WORDSTORM 3D co-op game"
          git push
